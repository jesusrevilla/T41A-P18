name: Run PostgreSQL Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2 pytest

    - name: Wait for PostgreSQL
      run: sleep 10

    - name: Create Arrays table and insert data
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 01_arrays.sql

    - name: Create Recursive CTE and insert hierarchy
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 02_cte_recursiva.sql

    - name: Run additional queries (optional)
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 03_test_queries.sql

    - name: Run Python unit tests
      run: pytest -vv
