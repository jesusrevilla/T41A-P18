¡Claro que sí! Aquí tienes el Workflow de GitHub Actions y el archivo de Tests Python completos, incluyendo los cuatro archivos SQL en la secuencia correcta.

🛠️ 1. Workflow Completo (.github/workflows/main.yml)
Este flujo ejecuta tus cuatro scripts SQL en orden (01_, 02_, 03_, y 04_) antes de correr las pruebas de Python.

YAML

name: Run PostgreSQL Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Wait for PostgreSQL
      run: |
        sleep 5 
        
    - name: Setup Database (4 SQL Exercises) 📊
      run: |
        export PGPASSWORD=postgres
        
        # 1. Arrays: Creación de tabla de productos
        echo "--> Running 01_array_products.sql"
        psql -h localhost -U postgres -d test_db -f 01_array_products.sql
        
        # 2. CTE: Jerarquía de Empleados
        echo "--> Running 02_cte_empleados_jerarquia.sql"
        psql -h localhost -U postgres -d test_db -f 02_cte_empleados_jerarquia.sql
        
        # 3. Arrays: Grafo de Ciudades (Creación de tabla con Arrays)
        echo "--> Running 03_array_city_connections.sql"
        psql -h localhost -U postgres -d test_db -f 03_array_city_connections.sql

        # 4. CTE: Consulta Recursiva de alcanzabilidad (Archivos 3 y 4 trabajan juntos)
        echo "--> Running 04_cte_reachable_cities.sql"
        psql -h localhost -U postgres -d test_db -f 04_cte_reachable_cities.sql

    - name: Run Python unit tests
      run: |
        pytest -vv
