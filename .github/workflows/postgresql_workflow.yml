name: Run PostgreSQL Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Wait for PostgreSQL
      run: |
        for i in {1..10}; do
          pg_isready -h localhost -U postgres -d test_db && break
          sleep 2
        done

    - name: Create and populate test database
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 01_Ejercicio_Propuesto_Arrays.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 02_Ejercicio_Propuesto_CTE_Empleados.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 03_Ejercicio_Grafos_Ciudades.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -f 04_Test_Ejercicios.sql

    - name: Run Python tests
      run: |
        python -m pytest test_postgresql_features.py -v

    - name: Run additional queries verification
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d test_db -c "
        -- Verificar datos finales
        SELECT 'Productos:' as categoria; SELECT COUNT(*) as total_productos FROM productos;
        SELECT 'Empleados:' as categoria; SELECT COUNT(*) as total_empleados FROM empleados;
        SELECT 'Ciudades:' as categoria; SELECT COUNT(*) as total_ciudades FROM ciudades;
        SELECT 'Rutas:' as categoria; SELECT COUNT(*) as total_rutas FROM rutas;
        "
